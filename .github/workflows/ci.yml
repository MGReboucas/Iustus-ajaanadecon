name: Verificações

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm run frontend:install
      - run: npm run typecheck
      - run: npm run test:documents
      - run: npm run build
      - run: npm run docs:check

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: iustus
          POSTGRES_USER: iustus
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iustus -d iustus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://iustus:ci-test-only@127.0.0.1:5432/iustus
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements-test.txt
      - run: python manage.py check --settings=config.settings.test
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: python manage.py test tests --settings=config.settings.test_postgres --noinput

  access-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: iustus
          POSTGRES_USER: iustus
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U iustus -d iustus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://iustus:ci-test-only@127.0.0.1:55432/iustus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r backend/requirements.lock
      - run: backend/.venv/bin/python infra/setup_local.py
      - run: backend/.venv/bin/python tests/e2e/fixture.py prepare
      - run: npm run frontend:install
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
      - run: npm run test:e2e

      - run: npm run test:e2e
        env:
          IDENTITY_MFA_REQUIRED: "false"
